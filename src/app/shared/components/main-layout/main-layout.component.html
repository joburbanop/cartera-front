<div style="display: flex; height: 100vh; background-color: #f4f5f7; font-family: 'Inter', sans-serif;">
  
  <!-- BARRA LATERAL OSCURA (SIDEBAR) -->
  <aside style="width: 260px; background-color: #16202a; border-right: 1px solid #1e293b; display: flex; flex-direction: column;">
    
    <!-- Logo y Título -->
    <div style="display: flex; align-items: center; gap: 12px; padding: 1.5rem; margin-bottom: 1rem;">
      <div style="width: 36px; height: 36px; background-color: #347769; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 1.1rem; letter-spacing: -0.5px;">
        CI
      </div>
      <div>
        <h2 style="margin: 0; font-size: 1.05rem; color: #ffffff; font-weight: 600;">Cartera Inmobiliaria</h2>
        <span style="font-size: 0.75rem; color: #94a3b8;">Panel de gestión</span>
      </div>
    </div>

    <!-- Navegación Plana (Sin acordeones) -->
    <nav style="display: flex; flex-direction: column; padding: 0 1rem;">
      
      <!-- Enlace: Dashboard -->
      <a routerLink="/dashboard" routerLinkActive="active-link" class="sidebar-link">
        <div class="bullet-icon"></div>
        Dashboard
      </a>

      <!-- CATEGORÍA: INVENTARIO -->
      <div class="sidebar-category">Inventario</div>
      
      <a routerLink="/projects" routerLinkActive="active-link" class="sidebar-link">
        <div class="bullet-icon"></div>
        Proyectos y Lotes
      </a>

     

      <!-- CATEGORÍA: CARTERA -->
      <div class="sidebar-category">Cartera</div>

      <a routerLink="/bank-accounts" routerLinkActive="active-link" class="sidebar-link">
        <div class="bullet-icon"></div>
        Cuentas bancarias
      </a>

      <a routerLink="/contracts" routerLinkActive="active-link" class="sidebar-link">
        <div class="bullet-icon"></div>
        Contratos
      </a>

      

    </nav>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main style="flex: 1; display: flex; flex-direction: column; overflow-y: auto;">
    
    <!-- Barra Superior (Header Rediseñado según el Mockup) -->
    <header style="padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; background: white; height: 70px; box-sizing: border-box;">
       
       <!-- Breadcrumbs (Migas de pan) -->
       <div style="color: #64748b; font-size: 0.95rem;">
         Inventario / <span style="color: #1e293b; font-weight: 600;">Proyectos y Lotes</span>
       </div>
       
       <!-- Lado Derecho: Buscador y Usuario -->
       <div style="display: flex; align-items: center; gap: 1rem;">
         
         <!-- Buscador Gris -->
         <div style="position: relative;">
           <input type="text" placeholder="Buscar proyecto..." style="background: #f1f5f9; border: 1px solid #e2e8f0; padding: 0.55rem 1rem; border-radius: 8px; font-size: 0.85rem; width: 220px; outline: none; color: #334155;">
         </div>

         <!-- Avatar de Usuario -->
         <div style="width: 36px; height: 36px; background: #e0f2fe; color: #0369a1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.85rem; cursor: pointer; border: 1px solid #bae6fd;">
           JD
         </div>
       </div>
    </header>

    <!-- Inyección de las Vistas (Tus formularios y tablas aparecerán aquí) -->
    <div style="padding: 2rem;">
      <router-outlet></router-outlet>
    </div>

  </main>

</div>
