<div *ngIf="isOpen" class="modal-backdrop" (click)="close()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Editar fecha de pago</h3>
      <button type="button" class="btn-close" (click)="close()" [disabled]="isSaving" aria-label="Cerrar modal">✕</button>
    </div>

    <div class="modal-body">
      <p class="modal-helper">Cuota {{ installmentNumberLabel }}</p>

      <label for="new-payment-date" class="modal-label">Nueva fecha de pago</label>
      <input
        id="new-payment-date"
        class="modal-input"
        type="date"
        [(ngModel)]="paymentDate"
        [disabled]="isSaving"
      />

      <p class="modal-warning" *ngIf="showTraceabilityWarning">
        Esta fecha quedará distinta a la de la transacción o recibo original
      </p>
      <p class="modal-note" *ngIf="!showTraceabilityWarning">
        Este cambio afecta únicamente esta cuota. No se recalcan otras fechas ni se modifican transacciones.
      </p>

      <label class="confirm-row">
        <input type="checkbox" [(ngModel)]="confirmed" [disabled]="isSaving || !paymentDate" />
        <span>Confirmo que quiero guardar esta fecha de pago.</span>
      </label>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="close()" [disabled]="isSaving">Cancelar</button>
      <button type="button" class="btn-save" (click)="save()" [disabled]="isSaving || !paymentDate || !confirmed">
        {{ isSaving ? 'Guardando...' : 'Confirmar y aplicar' }}
      </button>
    </div>
  </div>
</div>
