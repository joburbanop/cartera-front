<div class="app-modal-backdrop app-modal-backdrop--stack" *ngIf="isOpen" (click)="close()">
  <div class="app-modal" (click)="$event.stopPropagation()">
    <div class="app-modal-header">
      <div>
        <h2>Registrar nuevo cliente</h2>
        <p>Se seleccionará automáticamente en el contrato.</p>
      </div>
      <button type="button" class="app-modal-close" (click)="close()" [disabled]="isSaving">×</button>
    </div>

    <form [formGroup]="customerForm" (ngSubmit)="saveQuickCustomer()" class="app-modal-body">
      <div class="app-form-grid">
        <div class="app-form-group app-form-span-2">
          <label class="app-form-label">Nombre completo *</label>
          <input class="app-form-input" type="text" formControlName="name" placeholder="Ej: William Rojas">
          <app-field-error [control]="customerForm.controls.name" label="El nombre"></app-field-error>
        </div>
        <div class="app-form-group">
          <label class="app-form-label">Cédula / Documento *</label>
          <input class="app-form-input" type="text" formControlName="document" placeholder="Ej: 94526871">
          <app-field-error [control]="customerForm.controls.document" label="El documento"></app-field-error>
        </div>
        <div class="app-form-group">
          <label class="app-form-label">Teléfono *</label>
          <input class="app-form-input" type="text" formControlName="phone" placeholder="Ej: 3150000000">
          <app-field-error [control]="customerForm.controls.phone" label="El teléfono"></app-field-error>
        </div>
        <div class="app-form-group app-form-span-2">
          <label class="app-form-label">Correo electrónico</label>
          <input class="app-form-input" type="email" formControlName="email" placeholder="Ej: correo@ejemplo.com">
          <app-field-error [control]="customerForm.controls.email" label="El correo"></app-field-error>
        </div>
      </div>

      <div class="app-form-actions">
        <button type="button" class="btn-secondary" (click)="close()" [disabled]="isSaving">Cancelar</button>
        <button type="submit" class="btn-primary" [disabled]="isSaving">
          {{ isSaving ? 'Guardando...' : 'Guardar y seleccionar' }}
        </button>
      </div>
    </form>
  </div>
</div>
