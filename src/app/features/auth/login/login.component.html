<div class="login-container" style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f3f4f6;">
  
  <div class="login-card" style="background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px;">
    <h2 style="text-align: center; color: #1f2937; margin-bottom: 0.5rem;">Acceso al Sistema</h2>
    <p style="text-align: center; color: #6b7280; margin-bottom: 2rem;">ERP Inmobiliario</p>

    <!-- Alerta de Error -->
    <div *ngIf="errorMessage" style="background: #fee2e2; color: #dc2626; padding: 1rem; border-radius: 4px; margin-bottom: 1rem; text-align: center;">
      {{ errorMessage }}
    </div>

    <!-- Formulario Reactivo -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 1rem;">
      
      <div class="form-group">
        <label for="email" style="display: block; margin-bottom: 0.5rem; font-weight: bold; color: #374151;">Correo Electrónico</label>
        <input id="email" type="email" formControlName="email" placeholder="lady@constructora.com" 
               style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 4px;">
      </div>

      <div class="form-group">
        <label for="password" style="display: block; margin-bottom: 0.5rem; font-weight: bold; color: #374151;">Contraseña</label>
        <input id="password" type="password" formControlName="password" placeholder="********" 
               style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 4px;">
      </div>

      <button type="submit" [disabled]="loginForm.invalid || isLoading" 
              style="margin-top: 1rem; width: 100%; padding: 0.75rem; background: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
        {{ isLoading ? 'Ingresando...' : 'Iniciar Sesión' }}
      </button>

    </form>
  </div>

</div>
